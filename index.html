<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz Claude Code</title>
<meta name="description" content="30 questions pour apprendre à coder avec un agent, de la première commande à la théorie agentique.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f6f4ef;
  --surface: #ffffff;
  --surface-2: #efece5;
  --ink: #1d1b18;
  --ink-2: #5c5850;
  --ink-3: #8f8a80;
  --line: #e2ded4;
  --ok: #18865b;
  --ok-bg: #e3f4ec;
  --ko: #c2412d;
  --ko-bg: #fbe9e5;
  --star: #e0a526;
  --n1: #12857a;
  --n1-bg: #e1f2ef;
  --n2: #c26a12;
  --n2-bg: #fbeedd;
  --n3: #6a4bd8;
  --n3-bg: #ece7fb;
  --shadow: 0 1px 2px rgba(30, 25, 15, .05), 0 6px 20px rgba(30, 25, 15, .06);
  --radius: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161513;
    --surface: #201f1c;
    --surface-2: #2a2925;
    --ink: #f1eee8;
    --ink-2: #b5b0a6;
    --ink-3: #7f7a71;
    --line: #34322d;
    --ok: #4cc493;
    --ok-bg: #173327;
    --ko: #f0826e;
    --ko-bg: #3a201b;
    --star: #f2bd45;
    --n1: #4cc2b4;
    --n1-bg: #15302c;
    --n2: #f0a050;
    --n2-bg: #36271a;
    --n3: #a58cf5;
    --n3-bg: #27213f;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161513;
  --surface: #201f1c;
  --surface-2: #2a2925;
  --ink: #f1eee8;
  --ink-2: #b5b0a6;
  --ink-3: #7f7a71;
  --line: #34322d;
  --ok: #4cc493;
  --ok-bg: #173327;
  --ko: #f0826e;
  --ko-bg: #3a201b;
  --star: #f2bd45;
  --n1: #4cc2b4;
  --n1-bg: #15302c;
  --n2: #f0a050;
  --n2-bg: #36271a;
  --n3: #a58cf5;
  --n3-bg: #27213f;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.55 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}
code, .mono {
  font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: .88em;
}
code {
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: .05em .35em;
  white-space: nowrap;
}
a { color: inherit; }
button { font: inherit; color: inherit; }

.terme {
  text-decoration: underline dotted color-mix(in srgb, var(--c, var(--ink-2)) 75%, transparent);
  text-decoration-thickness: 1.5px;
  text-underline-offset: 4px;
  cursor: help;
}
#infobulle {
  position: fixed; left: 0; top: 0; z-index: 100;
  max-width: min(300px, calc(100vw - 32px));
  padding: 9px 12px; border-radius: 8px;
  background: var(--ink); color: var(--bg);
  font: 400 13.5px/1.45 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  letter-spacing: 0; text-align: left; text-transform: none;
  box-shadow: var(--shadow);
  pointer-events: none;
  visibility: hidden; opacity: 0; transform: translateY(3px);
  transition: opacity .12s ease, transform .12s ease, visibility 0s linear .12s;
}
#infobulle.visible { visibility: visible; opacity: 1; transform: none; transition-delay: 0s; }
#infobulle code { background: color-mix(in srgb, var(--bg) 18%, transparent); border-color: transparent; color: inherit; }

.page {
  max-width: 760px;
  margin: 0 auto;
  padding: 32px 16px 64px;
}

/* ---------- Accueil ---------- */
.hero { margin: 16px 0 36px; }
.eyebrow {
  font: 600 13px/1 "JetBrains Mono", ui-monospace, monospace;
  color: var(--ink-3);
  letter-spacing: .02em;
  margin-bottom: 14px;
}
.eyebrow .prompt { color: var(--n1); }
h1 {
  font-size: clamp(30px, 6vw, 44px);
  line-height: 1.1;
  letter-spacing: -.025em;
  margin: 0 0 14px;
  font-weight: 800;
}
.hero p { color: var(--ink-2); margin: 0; max-width: 560px; font-size: 17px; }
.total {
  display: flex; align-items: center; gap: 10px;
  margin-top: 20px; color: var(--ink-2); font-size: 14px;
}

.niveaux { display: grid; gap: 14px; }
.carte {
  --c: var(--n1); --c-bg: var(--n1-bg);
  display: grid;
  grid-template-columns: 56px 1fr auto;
  gap: 18px;
  align-items: center;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--shadow);
  text-align: left;
  cursor: pointer;
  transition: transform .15s ease, border-color .15s ease;
  width: 100%;
}
.carte:hover { transform: translateY(-2px); border-color: var(--c); }
.carte:focus-visible { outline: 2px solid var(--c); outline-offset: 2px; }
.carte .num {
  width: 56px; height: 56px; border-radius: 12px;
  background: var(--c-bg); color: var(--c);
  display: grid; place-items: center;
  font: 700 22px/1 "JetBrains Mono", ui-monospace, monospace;
}
.carte h2 { margin: 0 0 2px; font-size: 19px; letter-spacing: -.01em; }
.carte .desc { margin: 0; color: var(--ink-2); font-size: 14.5px; }
.carte .meta { display: flex; align-items: center; gap: 12px; margin-top: 10px; font-size: 13px; color: var(--ink-3); }
.mini-barre { flex: 0 0 90px; height: 5px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.mini-barre span { display: block; height: 100%; background: var(--c); border-radius: 3px; }
.carte .action {
  font-weight: 600; font-size: 14px; color: var(--c);
  white-space: nowrap;
}
.etoiles { display: inline-flex; gap: 2px; }
.etoiles svg { width: 16px; height: 16px; }
.etoile-pleine { fill: var(--star); }
.etoile-vide { fill: none; stroke: var(--ink-3); stroke-width: 1.5; opacity: .6; }

.pied {
  margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--line);
  display: flex; flex-wrap: wrap; gap: 8px 20px; justify-content: space-between;
  color: var(--ink-3); font-size: 13px;
}
.lien-discret {
  background: none; border: none; padding: 0; cursor: pointer;
  color: var(--ink-3); text-decoration: underline; text-underline-offset: 3px;
}
.lien-discret:hover { color: var(--ink); }

/* ---------- Question ---------- */
.barre-haut {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  margin-bottom: 14px; font-size: 14px; color: var(--ink-2);
}
.retour {
  background: none; border: none; cursor: pointer; padding: 6px 0;
  color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px;
}
.retour:hover { color: var(--ink); }
.niveau-tag { font-weight: 600; color: var(--c); }
.progression { display: flex; gap: 4px; margin-bottom: 24px; }
.progression span {
  flex: 1; height: 6px; border-radius: 3px; background: var(--surface-2);
  transition: background .3s ease;
}
.progression .ok { background: var(--ok); }
.progression .ko { background: var(--ko); }
.progression .courant { background: var(--c); opacity: .55; }

.question {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 28px;
  animation: entree .35s ease both;
}
@keyframes entree { from { opacity: 0; transform: translateY(8px); } }
.type {
  display: inline-flex; align-items: center; gap: 6px;
  font: 600 12px/1 "JetBrains Mono", ui-monospace, monospace;
  text-transform: uppercase; letter-spacing: .06em;
  color: var(--c); background: var(--c-bg);
  padding: 6px 9px; border-radius: 6px;
  margin-bottom: 16px;
}
.enonce { font-size: 20px; line-height: 1.45; font-weight: 600; letter-spacing: -.01em; margin: 0 0 6px; }
.consigne { color: var(--ink-3); font-size: 14px; margin: 0 0 20px; }
.contexte {
  background: var(--surface-2); border-left: 3px solid var(--c);
  padding: 12px 16px; border-radius: 0 8px 8px 0; margin: 0 0 20px;
  color: var(--ink-2); font-size: 15px;
}

.choix { display: grid; gap: 10px; }
.option {
  display: grid; grid-template-columns: 28px 1fr 22px; gap: 12px; align-items: start;
  width: 100%; text-align: left;
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px;
  padding: 13px 14px; cursor: pointer; font-size: 15.5px; line-height: 1.45;
  transition: border-color .15s ease, background .15s ease, transform .1s ease;
}
.option:hover:not(:disabled) { border-color: var(--c); background: var(--c-bg); }
.option:active:not(:disabled) { transform: scale(.99); }
.option:disabled { cursor: default; }
.option .lettre {
  width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center;
  background: var(--surface-2); color: var(--ink-2);
  font: 600 13px/1 "JetBrains Mono", ui-monospace, monospace;
}
.option .icone { width: 22px; height: 22px; margin-top: 3px; }
.option.prompt-opt .texte {
  font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 13.5px; line-height: 1.6;
}
.option.prompt-opt .texte code { background: none; border: none; padding: 0; font-size: inherit; }
.option.bonne { border-color: var(--ok); background: var(--ok-bg); animation: lueur .6s ease; }
.option.bonne .lettre { background: var(--ok); color: #fff; }
.option.mauvaise { border-color: var(--ko); background: var(--ko-bg); animation: secoue .35s ease; }
.option.mauvaise .lettre { background: var(--ko); color: #fff; }
.option.estompee { opacity: .5; }
@keyframes lueur { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 45%, transparent); } 100% { box-shadow: 0 0 0 10px transparent; } }
@keyframes secoue { 20%, 60% { transform: translateX(-4px); } 40%, 80% { transform: translateX(4px); } }

.vf { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.vf .option { grid-template-columns: 1fr; justify-items: center; text-align: center; padding: 18px; font-weight: 700; font-size: 17px; }

/* Remettre dans l'ordre */
.zone-titre { font-size: 12.5px; font-weight: 600; color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; margin: 4px 0 8px; }
.ordre-reponse {
  display: grid; gap: 8px; min-height: 52px; padding: 10px;
  border: 1.5px dashed var(--line); border-radius: 10px; margin-bottom: 18px;
}
.ordre-reponse:empty::before { content: "Clique sur les étapes ci-dessous dans le bon ordre."; color: var(--ink-3); font-size: 14px; padding: 4px 6px; }
.etape {
  display: grid; grid-template-columns: 28px 1fr auto; gap: 12px; align-items: center;
  width: 100%; text-align: left; cursor: pointer;
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px;
  padding: 11px 14px; font-size: 15px; line-height: 1.4;
  transition: border-color .15s ease, background .15s ease;
}
.etape:hover:not(:disabled) { border-color: var(--c); }
.etape:disabled { cursor: default; }
.etape .rang {
  width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
  background: var(--c); color: #fff; font: 600 13px/1 "JetBrains Mono", ui-monospace, monospace;
}
.etape .rang.vide { background: var(--surface-2); color: var(--ink-3); }
.etape .note { font-size: 12.5px; color: var(--ink-3); }
.etape.bonne { border-color: var(--ok); background: var(--ok-bg); }
.etape.bonne .rang { background: var(--ok); }
.etape.mauvaise { border-color: var(--ko); background: var(--ko-bg); }
.etape.mauvaise .rang { background: var(--ko); }
.ordre-pool { display: grid; gap: 8px; }

/* Associer */
.assoc { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 10px 14px; }
.assoc .col { display: grid; gap: 8px; align-content: start; }
.tuile {
  position: relative; width: 100%; text-align: left; cursor: pointer;
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px;
  padding: 11px 12px 11px 14px; font-size: 14.5px; line-height: 1.4; min-height: 50px;
  display: flex; align-items: center; gap: 10px;
  transition: border-color .15s ease, background .15s ease, box-shadow .15s ease;
}
.tuile:hover:not(:disabled) { border-color: var(--c); }
.tuile:disabled { cursor: default; }
.tuile.active { border-color: var(--c); background: var(--c-bg); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 25%, transparent); }
.tuile .pastille {
  flex: 0 0 22px; height: 22px; border-radius: 50%; display: grid; place-items: center;
  font: 700 12px/1 "JetBrains Mono", ui-monospace, monospace; color: #fff;
}
.tuile .pastille.vide { border: 1.5px dashed var(--line); }
.tuile.bonne { border-color: var(--ok); background: var(--ok-bg); }
.tuile.mauvaise { border-color: var(--ko); background: var(--ko-bg); }
.p0 { background: #2f7fd6; } .p1 { background: #d0418b; } .p2 { background: #c98a10; }
.p3 { background: #3c9b4d; } .p4 { background: #7a55d6; } .p5 { background: #d65a2f; }

.actions-q { display: flex; justify-content: flex-end; margin-top: 20px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: none; border-radius: 10px; padding: 12px 20px; cursor: pointer;
  font-weight: 600; font-size: 15px;
  background: var(--c, var(--ink)); color: #fff;
  transition: filter .15s ease, transform .1s ease, opacity .15s ease;
}
.btn:hover:not(:disabled) { filter: brightness(1.08); }
.btn:active:not(:disabled) { transform: scale(.98); }
.btn:disabled { opacity: .35; cursor: not-allowed; }
.btn.secondaire { background: var(--surface); color: var(--ink); border: 1.5px solid var(--line); }
.btn.secondaire:hover { border-color: var(--ink-3); filter: none; }
.kbd { font: 500 11.5px/1 "JetBrains Mono", ui-monospace, monospace; opacity: .7; border: 1px solid currentColor; border-radius: 4px; padding: 2px 4px; }

.retour-q {
  margin-top: 18px; border-radius: 12px; padding: 18px 20px;
  border: 1px solid var(--line); background: var(--surface-2);
  animation: entree .3s ease both;
}
.retour-q.ok { border-color: color-mix(in srgb, var(--ok) 40%, transparent); background: var(--ok-bg); }
.retour-q.ko { border-color: color-mix(in srgb, var(--ko) 40%, transparent); background: var(--ko-bg); }
.verdict { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-weight: 700; font-size: 16px; margin-bottom: 6px; }
.verdict .icone { width: 22px; height: 22px; flex: none; }
.retour-q.ok .verdict { color: var(--ok); }
.retour-q.ko .verdict { color: var(--ko); }
.retour-q p { margin: 0 0 8px; font-size: 15px; color: var(--ink); }
.retour-q p:last-child { margin-bottom: 0; }
.astuce { display: flex; gap: 10px; margin-top: 12px; padding-top: 12px; border-top: 1px solid color-mix(in srgb, var(--ink) 10%, transparent); font-size: 14.5px; color: var(--ink-2); }
.astuce b { color: var(--ink); white-space: nowrap; }
.doc { display: inline-flex; align-items: center; gap: 4px; margin-top: 10px; font-size: 14px; font-weight: 600; color: var(--c); text-decoration: none; }
.doc:hover { text-decoration: underline; text-underline-offset: 3px; }
.suite { display: flex; justify-content: flex-end; margin-top: 16px; }

/* ---------- Bilan ---------- */
.bilan { text-align: center; padding: 36px 28px; }
.bilan .grand-score { font: 800 64px/1 Inter, system-ui, sans-serif; letter-spacing: -.03em; margin: 8px 0 6px; }
.bilan .grand-score small { font-size: 28px; color: var(--ink-3); font-weight: 700; }
.bilan .message { color: var(--ink-2); margin: 0 auto 8px; max-width: 440px; }
.bilan .meilleur { color: var(--ink-3); font-size: 13.5px; margin: 0; }
.grandes-etoiles { display: flex; justify-content: center; gap: 10px; margin: 18px 0 6px; }
.grandes-etoiles svg { width: 44px; height: 44px; }
.grandes-etoiles .etoile-pleine { animation: pop .5s cubic-bezier(.3, 1.6, .5, 1) both; }
.grandes-etoiles svg:nth-child(2) .etoile-pleine { animation-delay: .15s; }
.grandes-etoiles svg:nth-child(3) .etoile-pleine { animation-delay: .3s; }
@keyframes pop { from { transform: scale(0); opacity: 0; } }
.grandes-etoiles path { transform-origin: center; transform-box: fill-box; }
.reflexes {
  text-align: left; margin: 28px 0 24px; padding: 20px 22px;
  background: var(--c-bg); border-radius: 12px;
}
.reflexes h3 { margin: 0 0 10px; font-size: 14px; text-transform: uppercase; letter-spacing: .06em; color: var(--c); }
.reflexes ol { margin: 0; padding-left: 22px; }
.reflexes li { margin: 6px 0; font-size: 15.5px; }
.actions-bilan { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }

@media (max-width: 560px) {
  .page { padding-top: 20px; }
  .carte { grid-template-columns: 44px 1fr; gap: 14px; padding: 16px; }
  .carte .num { width: 44px; height: 44px; font-size: 18px; }
  .carte .action { grid-column: 2; }
  .question { padding: 20px 16px; }
  .enonce { font-size: 18px; }
  .assoc { grid-template-columns: 1fr 1.3fr; gap: 8px; }
  .tuile { font-size: 13.5px; padding: 9px 10px; }
  .kbd { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<main class="page" id="app" aria-live="polite"></main>

<script>
"use strict";

/* =====================================================================
   Contenu du quiz
   Types : "choix" (QCM, mise en situation, meilleur prompt), "vf",
   "ordre" (étapes dans le bon ordre), "associe" (paires gauche/droite).
   Dans les textes : `code` et **gras**.
   ===================================================================== */
const DOC = "https://code.claude.com/docs/en/";

const NIVEAUX = [
  {
    id: "n1",
    titre: "Premiers pas",
    description: "Se servir de Claude Code : lancer, autoriser, interrompre, revenir en arrière.",
    reflexes: [
      "Lire une commande avant de l’autoriser, et demander quand on ne la comprend pas.",
      "Une tâche, une conversation : `/clear` entre deux sujets sans rapport.",
      "Vérifier soi-même, puis commiter : chaque commit est un point de sauvegarde.",
    ],
    questions: [
      {
        type: "choix", badge: "QCM",
        enonce: "Qu’est-ce qui distingue un agent de code comme Claude Code d’un chatbot ?",
        choix: [
          "Il agit : il lit les fichiers, les modifie, lance des commandes, puis observe le résultat pour décider de la suite.",
          "Il utilise forcément un modèle plus intelligent qu’un chatbot.",
          "Il ne se trompe pas, puisqu’il peut tout tester.",
          "Il fonctionne sans connexion internet, directement sur la machine.",
        ],
        bonne: 0,
        explication: "Le modèle peut être exactement le même que celui d’un chatbot. La différence, ce sont les **outils** et la **boucle** : l’agent agit sur le projet, voit ce qui se passe, et recommence jusqu’à ce que la tâche soit finie.",
        doc: "how-claude-code-works",
      },
      {
        type: "choix", badge: "QCM",
        enonce: "Pour que Claude Code travaille sur un projet, que faut-il faire ?",
        choix: [
          "Lancer `claude` dans le dossier du projet.",
          "Copier-coller le code du projet dans la conversation.",
          "Envoyer une archive du projet sur un site web.",
          "Donner l’URL du dépôt GitHub dans le premier message.",
        ],
        bonne: 0,
        explication: "Claude Code travaille dans le dossier où il est lancé. Il va lui-même chercher et lire les fichiers dont il a besoin : inutile de tout coller, il suffit de lui dire ce qu’on veut.",
        astuce: "Pour pointer un fichier précis, on peut le mentionner avec `@`, par exemple `@src/app.ts`.",
        doc: "quickstart",
      },
      {
        type: "choix", badge: "Mise en situation",
        enonce: "Claude me demande la permission de lancer `rm -rf build/ && npm install`. Je ne suis pas sûr de comprendre ce que fait cette commande. Que dois-je faire ?",
        choix: [
          "Je refuse, ou je lui demande d’abord ce que fait la commande et pourquoi il en a besoin.",
          "J’accepte : s’il la propose, c’est qu’elle est nécessaire.",
          "J’accepte en choisissant de ne plus être sollicité, pour gagner du temps.",
          "Je ferme le terminal par précaution.",
        ],
        bonne: 0,
        explication: "Les demandes de permission sont le moment où l’on garde la main. Une commande qu’on ne comprend pas mérite une question : c’est aussi une occasion d’apprendre. Ici, `rm -rf build/` supprime le dossier `build`, puis `npm install` réinstalle les dépendances.",
        astuce: "Refuser n’arrête pas tout : on peut dire à Claude ce qu’il doit faire à la place.",
        doc: "permissions",
      },

  "subagent": { mots: "subagents?", def: "Agent secondaire lancé par Claude avec un contexte vierge : il travaille de son côté et ne renvoie qu’un résumé." },
  "hook": { mots: "hooks?", def: "Script lancé automatiquement par Claude Code à un moment précis (avant ou après un outil, en fin de tour…), sans dépendre du modèle." },
  "mcp": { mots: "serveurs? MCP|MCP", def: "Model Context Protocol : standard pour brancher des outils externes à Claude (base de données, navigateur, tickets…)." },
  "harnais": { mots: "harnais", def: "Le programme Claude Code autour du modèle : il exécute les outils demandés, gère le contexte et applique les permissions." },
  "bac-a-sable": { mots: "bac à sable", def: "Isolation qui limite les fichiers et le réseau accessibles aux commandes lancées par Claude (`/sandbox`)." },
};
const MOTS = Object.entries(TERMES)
  .filter(([, t]) => t.mots)
  .sort(([, a], [, b]) => b.mots.length - a.mots.length)
  .map(([cle, t]) => ({ cle, source: t.mots, re: new RegExp(`^(?:${t.mots})$`, "iu") }));
const RE_MOTS = new RegExp(`(?<![\\p{L}\\d])(?:${MOTS.map(m => `(?:${m.source})`).join("|")})(?![\\p{L}\\d])`, "giu");

/* =====================================================================
   État et sauvegarde (localStorage, uniquement dans ce navigateur)
   ===================================================================== */
const CLE = "quiz-claude-code-v1";

function etatVide() {
  const niveaux = {};
  for (const n of NIVEAUX) niveaux[n.id] = { reponses: {}, meilleur: null };
  return { niveaux };
}
function charger() {
  try {
    const brut = localStorage.getItem(CLE);
    if (!brut) return etatVide();
    const lu = JSON.parse(brut);
    const etat = etatVide();
    for (const n of NIVEAUX) {
      if (lu && lu.niveaux && lu.niveaux[n.id]) Object.assign(etat.niveaux[n.id], lu.niveaux[n.id]);
    }
    return etat;
  } catch (e) { return etatVide(); }
}
function sauver() {
  try { localStorage.setItem(CLE, JSON.stringify(etat)); } catch (e) { /* stockage indisponible : on joue sans sauvegarde */ }
}

let etat = charger();
let vue = { ecran: "accueil" };

const niveauParId = id => NIVEAUX.find(n => n.id === id);
const nbRepondues = id => Object.keys(etat.niveaux[id].reponses).length;
const score = id => Object.values(etat.niveaux[id].reponses).filter(r => r.ok).length;
const termine = id => nbRepondues(id) === niveauParId(id).questions.length;
const prochaineQuestion = id => niveauParId(id).questions.findIndex((_, i) => !(i in etat.niveaux[id].reponses));
function etoiles(points) {
  if (points == null) return 0;
  if (points >= 9) return 3;
  if (points >= 7) return 2;
  if (points >= 5) return 1;
  return 0;
}

/* =====================================================================
   Utilitaires d'affichage
   ===================================================================== */
const $app = document.getElementById("app");

function echapper(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function texteSimple(s) {
  return echapper(s).replace(/`([^`]+)`/g, "<code>$1</code>");
}
const baliseTerme = (cle, html) => `<span class="terme" data-terme="${echapper(cle)}">${html}</span>`;
function cleCode(c) {
  if (c.startsWith("@")) return "@";
  if (c.startsWith("/")) c = c.split(" ")[0];
  else if (/^claude\s+(--continue|-c)\b/.test(c)) c = "claude --continue";
  else if (/^claude\s+-p\b/.test(c)) c = "claude -p";
  return TERMES[c] && !TERMES[c].mots ? c : null;
}
function marquerCode(c) {
  const html = `<code>${echapper(c)}</code>`;
  const cle = cleCode(c);
  return cle ? baliseTerme(cle, html) : html;
}
const marquerMots = html => html.replace(RE_MOTS, m => baliseTerme(MOTS.find(x => x.re.test(m)).cle, m));
function md(s) {
  return String(s)
    .split(/(`[^`]+`)/)
    .map((morceau, i) => i % 2 ? marquerCode(morceau.slice(1, -1)) : marquerMots(echapper(morceau)))
    .join("")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
}

const $bulle = document.createElement("div");
$bulle.id = "infobulle";
$bulle.setAttribute("role", "tooltip");
document.body.append($bulle);
let termeActif = null;
function montrerBulle(t) {
  termeActif = t;
  $bulle.innerHTML = texteSimple(TERMES[t.dataset.terme].def);
  $bulle.style.left = "0px";
  $bulle.style.top = "0px";
  const r = t.getBoundingClientRect();
  const b = $bulle.getBoundingClientRect();
  const marge = 8;
  const gauche = Math.min(Math.max(r.left + r.width / 2 - b.width / 2, marge), innerWidth - b.width - marge);
  const haut = r.top - b.height - marge >= marge ? r.top - b.height - marge : r.bottom + marge;
  $bulle.style.left = `${gauche}px`;
  $bulle.style.top = `${haut}px`;
  $bulle.classList.add("visible");
}
function cacherBulle() {
  termeActif = null;
  $bulle.classList.remove("visible");
}
document.addEventListener("mouseover", ev => {
  const t = ev.target.closest(".terme");
  if (t === termeActif) return;
  if (t) montrerBulle(t);
  else cacherBulle();
});
document.addEventListener("pointerdown", ev => { if (!ev.target.closest(".terme")) cacherBulle(); });
document.addEventListener("keydown", cacherBulle);
addEventListener("scroll", cacherBulle, { passive: true });
function melanger(tab) {
  const t = tab.slice();
  for (let i = t.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [t[i], t[j]] = [t[j], t[i]];
  }
  return t;
}
function melangerDifferent(indices) {
  if (indices.length < 2) return indices;
  let t;
  do { t = melanger(indices); } while (t.every((v, i) => v === indices[i]));
  return t;
}
function el(html) {
  const d = document.createElement("div");
  d.innerHTML = html.trim();
  return d.firstElementChild;
}
const ETOILE = "M12 2.6l2.82 5.72 6.31.92-4.57 4.45 1.08 6.29L12 17.01l-5.64 2.97 1.08-6.29L2.87 9.24l6.31-.92z";
function htmlEtoiles(n, classe = "etoiles") {
  let s = `<span class="${classe}" aria-label="${n} étoile${n > 1 ? "s" : ""} sur 3">`;
  for (let i = 0; i < 3; i++) {
    s += `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${ETOILE}" class="${i < n ? "etoile-pleine" : "etoile-vide"}"/></svg>`;
  }
  return s + "</span>";
}
const ICONE_OK = `<svg class="icone" viewBox="0 0 24 24" fill="none" stroke="var(--ok)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`;
const ICONE_KO = `<svg class="icone" viewBox="0 0 24 24" fill="none" stroke="var(--ko)" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>`;
const VIDE = `<span class="icone" aria-hidden="true"></span>`;

function couleur(niveau) {
  return `--c: var(--${niveau.id}); --c-bg: var(--${niveau.id}-bg);`;
}

/* =====================================================================
   Écran d'accueil
   ===================================================================== */
function afficherAccueil() {
  vue = { ecran: "accueil" };
  const totalEtoiles = NIVEAUX.reduce((s, n) => s + etoiles(etat.niveaux[n.id].meilleur), 0);
  let html = `
    <header class="hero">
      <div class="eyebrow"><span class="prompt">&gt;</span> claude</div>
      <h1>Coder avec un agent</h1>
      <p>30 questions pour passer de la première commande à la théorie des agents. Chaque réponse est corrigée et expliquée tout de suite. On peut s’arrêter à tout moment et reprendre plus tard.</p>
      <div class="total">${htmlEtoiles(Math.min(3, Math.ceil(totalEtoiles / 3)))}<span>${totalEtoiles} étoile${totalEtoiles > 1 ? "s" : ""} sur 9</span></div>
    </header>
    <section class="niveaux">`;
  NIVEAUX.forEach((n, i) => {
    const fait = nbRepondues(n.id);
    const total = n.questions.length;
    const meilleur = etat.niveaux[n.id].meilleur;
    let action = "Commencer";
    if (termine(n.id)) action = "Voir le bilan";
    else if (fait > 0) action = "Reprendre";
    const meta = meilleur != null
      ? `${htmlEtoiles(etoiles(meilleur))}<span>Meilleur score : ${meilleur}/${total}</span>`
      : `<span class="mini-barre"><span style="width:${(fait / total) * 100}%"></span></span><span>${fait}/${total}</span>`;
    html += `
      <button class="carte" style="${couleur(n)}" data-niveau="${n.id}">
        <span class="num">${i + 1}</span>
        <span>
          <h2>${md(n.titre)}</h2>
          <p class="desc">${md(n.description)}</p>
          <span class="meta">${meta}${meilleur != null && fait > 0 && !termine(n.id) ? `<span>· en cours ${fait}/${total}</span>` : ""}</span>
        </span>
        <span class="action">${action} →</span>
      </button>`;
  });
  html += `</section>
    <footer class="pied">
      <span>Progression enregistrée dans ce navigateur uniquement.</span>
      <button class="lien-discret" id="raz">Tout recommencer à zéro</button>
    </footer>`;
  $app.innerHTML = html;
  $app.querySelectorAll(".carte").forEach(b => b.addEventListener("click", () => ouvrirNiveau(b.dataset.niveau)));
  document.getElementById("raz").addEventListener("click", () => {
    if (confirm("Effacer toute la progression et les étoiles ?")) {
      etat = etatVide();
      sauver();
      afficherAccueil();
    }
  });
  window.scrollTo(0, 0);
}

function ouvrirNiveau(id) {
  if (termine(id)) afficherBilan(id);
  else afficherQuestion(id, prochaineQuestion(id));
}

/* =====================================================================
   Écran de question
   ===================================================================== */
const BRAVO = ["Exact.", "Bien vu.", "C’est ça.", "Parfait.", "Correct."];
const RATE = ["Pas tout à fait.", "Raté, mais c’est fait pour apprendre.", "Non, voici pourquoi."];
const hasard = t => t[Math.floor(Math.random() * t.length)];

function afficherQuestion(id, index) {
  const niveau = niveauParId(id);
  const q = niveau.questions[index];
  vue = { ecran: "question", id, index, repondu: false };

  const segments = niveau.questions.map((_, i) => {
    const r = etat.niveaux[id].reponses[i];
    const cls = r ? (r.ok ? "ok" : "ko") : (i === index ? "courant" : "");
    return `<span class="${cls}"></span>`;
  }).join("");

  const badge = q.type === "vf" ? "Vrai ou faux" : q.type === "ordre" ? "Remettre dans l’ordre" : q.type === "associe" ? "Associer" : q.badge;

  $app.innerHTML = `
    <div style="${couleur(niveau)}">
      <div class="barre-haut">
        <button class="retour" id="retour">← Accueil</button>
        <span><span class="niveau-tag">${md(niveau.titre)}</span> · Question ${index + 1}/${niveau.questions.length}</span>
      </div>
      <div class="progression" aria-hidden="true">${segments}</div>
      <article class="question">
        <div class="type">${badge}</div>
        <p class="enonce">${md(q.enonce)}</p>
        ${q.consigne ? `<p class="consigne">${md(q.consigne)}</p>` : `<div style="height:14px"></div>`}
        <div id="zone"></div>
        <div id="retour-q"></div>
      </article>
    </div>`;
  document.getElementById("retour").addEventListener("click", afficherAccueil);

  const zone = document.getElementById("zone");
  if (q.type === "choix") rendreChoix(zone, q, id, index);
  else if (q.type === "vf") rendreVF(zone, q, id, index);
  else if (q.type === "ordre") rendreOrdre(zone, q, id, index);
  else if (q.type === "associe") rendreAssocie(zone, q, id, index);
  window.scrollTo(0, 0);
}

function enregistrer(id, index, ok) {
  etat.niveaux[id].reponses[index] = { ok };
  const n = niveauParId(id);
  if (termine(id)) {
    const s = score(id);
    const m = etat.niveaux[id].meilleur;
    etat.niveaux[id].meilleur = m == null ? s : Math.max(m, s);
  }
  sauver();
  vue.repondu = true;
  const seg = $app.querySelectorAll(".progression span")[index];
  if (seg) seg.className = ok ? "ok" : "ko";
}

function afficherRetour(q, ok, id, index, detail) {
  const niveau = niveauParId(id);
  const derniere = index === niveau.questions.length - 1 || termine(id);
  const lien = q.doc ? `<a class="doc" href="${DOC}${q.doc}" target="_blank" rel="noopener">Pour aller plus loin, la doc ↗</a>` : "";
  const box = document.getElementById("retour-q");
  box.innerHTML = `
    <div class="retour-q ${ok ? "ok" : "ko"}" role="status">
      <div class="verdict">${ok ? ICONE_OK : ICONE_KO}${ok ? hasard(BRAVO) : hasard(RATE)}${detail ? `<span style="font-weight:500;color:var(--ink-2);font-size:14px">${detail}</span>` : ""}</div>
      <p>${md(q.explication)}</p>
      ${q.astuce ? `<div class="astuce"><b>Astuce</b><span>${md(q.astuce)}</span></div>` : ""}
      ${lien}
    </div>
    <div class="suite">
      <button class="btn" id="suivant">${derniere ? "Voir le bilan" : "Question suivante"} <span class="kbd">↵</span></button>
    </div>`;
  const suivant = document.getElementById("suivant");
  suivant.addEventListener("click", () => {
    if (termine(id)) afficherBilan(id);
    else afficherQuestion(id, prochaineQuestion(id));
  });
  suivant.focus({ preventScroll: true });
  box.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "nearest" });
}

/* --- QCM, mise en situation, meilleur prompt --- */
function rendreChoix(zone, q, id, index) {
  const ordre = melanger(q.choix.map((_, i) => i));
  const lettres = "ABCDEF";
  zone.innerHTML = `<div class="choix">${ordre.map((orig, pos) => `
    <button class="option ${q.prompts ? "prompt-opt" : ""}" data-orig="${orig}">
      <span class="lettre">${lettres[pos]}</span>
      <span class="texte">${q.prompts ? "› " : ""}${md(q.choix[orig])}</span>
      ${VIDE}
    </button>`).join("")}</div>`;
  const boutons = [...zone.querySelectorAll(".option")];
  const repondre = bouton => {
    if (vue.repondu) return;
    const choisi = Number(bouton.dataset.orig);
    const ok = choisi === q.bonne;
    boutons.forEach(b => {
      b.disabled = true;
      const o = Number(b.dataset.orig);
      if (o === q.bonne) { b.classList.add("bonne"); b.lastElementChild.outerHTML = ICONE_OK; }
      else if (b === bouton) { b.classList.add("mauvaise"); b.lastElementChild.outerHTML = ICONE_KO; }
      else b.classList.add("estompee");
    });
    enregistrer(id, index, ok);
    afficherRetour(q, ok, id, index);
  };
  boutons.forEach(b => b.addEventListener("click", () => repondre(b)));
  vue.raccourcis = touche => {
    const i = "1234".indexOf(touche) >= 0 ? Number(touche) - 1 : "abcd".indexOf(touche.toLowerCase());
    if (i >= 0 && boutons[i]) repondre(boutons[i]);
  };
}

/* --- Vrai ou faux --- */
function rendreVF(zone, q, id, index) {
  zone.innerHTML = `<div class="vf">
    <button class="option" data-v="true">Vrai</button>
    <button class="option" data-v="false">Faux</button>
  </div>`;
  const boutons = [...zone.querySelectorAll(".option")];
  const repondre = bouton => {
    if (vue.repondu) return;
    const v = bouton.dataset.v === "true";
    const ok = v === q.bonne;
    boutons.forEach(b => {
      b.disabled = true;
      const bv = b.dataset.v === "true";
      if (bv === q.bonne) b.classList.add("bonne");
      else if (b === bouton) b.classList.add("mauvaise");
      else b.classList.add("estompee");
    });
    enregistrer(id, index, ok);
    afficherRetour(q, ok, id, index);
  };
  boutons.forEach(b => b.addEventListener("click", () => repondre(b)));
  vue.raccourcis = touche => {
    const t = touche.toLowerCase();
    if (t === "v" || t === "1") repondre(boutons[0]);
    if (t === "f" || t === "2") repondre(boutons[1]);
  };
}

/* --- Remettre dans l'ordre --- */
function rendreOrdre(zone, q, id, index) {
  const pool = melangerDifferent(q.etapes.map((_, i) => i));
  const choisi = [];
  zone.innerHTML = `
    <div class="zone-titre">Ma réponse</div>
    <div class="ordre-reponse" id="ordre-reponse"></div>
    <div class="zone-titre" id="titre-pool">Étapes à placer</div>
    <div class="ordre-pool" id="ordre-pool"></div>
    <div class="actions-q"><button class="btn" id="valider" disabled>Valider</button></div>`;
  const $rep = document.getElementById("ordre-reponse");
  const $pool = document.getElementById("ordre-pool");
  const $valider = document.getElementById("valider");

  function dessiner() {
    $rep.innerHTML = choisi.map((orig, pos) => `
      <button class="etape" data-orig="${orig}" title="Retirer">
        <span class="rang">${pos + 1}</span><span>${md(q.etapes[orig])}</span><span class="note">retirer</span>
      </button>`).join("");
    const restants = pool.filter(i => !choisi.includes(i));
    $pool.innerHTML = restants.map(orig => `
      <button class="etape" data-orig="${orig}">
        <span class="rang vide">·</span><span>${md(q.etapes[orig])}</span><span></span>
      </button>`).join("");
    document.getElementById("titre-pool").style.display = restants.length ? "" : "none";
    $valider.disabled = restants.length > 0;
    $rep.querySelectorAll(".etape").forEach(b => b.addEventListener("click", () => {
      choisi.splice(choisi.indexOf(Number(b.dataset.orig)), 1); dessiner();
    }));
    $pool.querySelectorAll(".etape").forEach(b => b.addEventListener("click", () => {
      choisi.push(Number(b.dataset.orig)); dessiner();
    }));
  }
  dessiner();

  $valider.addEventListener("click", () => {
    if (vue.repondu) return;
    const bienPlaces = choisi.filter((orig, pos) => orig === pos).length;
    const ok = bienPlaces === q.etapes.length;
    $rep.innerHTML = choisi.map((orig, pos) => `
      <button class="etape ${orig === pos ? "bonne" : "mauvaise"}" disabled>
        <span class="rang">${pos + 1}</span><span>${md(q.etapes[orig])}</span>
        <span class="note">${orig === pos ? "" : `→ position ${orig + 1}`}</span>
      </button>`).join("");
    $valider.parentElement.remove();
    enregistrer(id, index, ok);
    afficherRetour(q, ok, id, index, ok ? "" : `${bienPlaces}/${q.etapes.length} bien placées`);
  });
  vue.raccourcis = touche => { if (touche === "Enter" && !$valider.disabled) $valider.click(); };
}

/* --- Associer --- */
function rendreAssocie(zone, q, id, index) {
  const n = q.paires.length;
  const droite = melangerDifferent(q.paires.map((_, i) => i));
  const lien = {};          // gauche -> droite (indices d'origine)
  let actif = null;         // { cote: "g" | "d", i }

  zone.innerHTML = `
    <div class="assoc">
      <div class="col" id="col-g"></div>
      <div class="col" id="col-d"></div>
    </div>
    <div class="actions-q"><button class="btn" id="valider" disabled>Valider</button></div>`;
  const $g = document.getElementById("col-g");
  const $d = document.getElementById("col-d");
  const $valider = document.getElementById("valider");

  const gaucheDe = d => { const g = Object.keys(lien).find(k => lien[k] === d); return g == null ? null : Number(g); };
  // Chaque paire prend la couleur de l'élément de gauche
  const pastille = g => g == null ? `<span class="pastille vide"></span>` : `<span class="pastille p${g}">${g + 1}</span>`;

  function dessiner() {
    $g.innerHTML = q.paires.map((p, g) => `
      <button class="tuile ${actif && actif.cote === "g" && actif.i === g ? "active" : ""}" data-g="${g}">
        ${lien[g] != null ? pastille(g) : `<span class="pastille p${g}">${g + 1}</span>`}<span>${md(p[0])}</span>
      </button>`).join("");
    $d.innerHTML = droite.map(d => {
      const g = gaucheDe(d);
      return `
      <button class="tuile ${actif && actif.cote === "d" && actif.i === d ? "active" : ""}" data-d="${d}">
        ${pastille(g)}<span>${md(q.paires[d][1])}</span>
      </button>`;
    }).join("");
    $valider.disabled = Object.keys(lien).length < n;
    $g.querySelectorAll(".tuile").forEach(b => b.addEventListener("click", () => cliquer("g", Number(b.dataset.g))));
    $d.querySelectorAll(".tuile").forEach(b => b.addEventListener("click", () => cliquer("d", Number(b.dataset.d))));
  }

  function relier(g, d) {
    const ancien = gaucheDe(d);
    if (ancien != null) delete lien[ancien];
    lien[g] = d;
  }

  function cliquer(cote, i) {
    if (vue.repondu) return;
    if (actif && actif.cote !== cote) {
      const g = cote === "g" ? i : actif.i;
      const d = cote === "d" ? i : actif.i;
      relier(g, d);
      actif = null;
    } else if (actif && actif.cote === cote && actif.i === i) {
      actif = null;
    } else {
      // Recliquer sur un élément déjà relié le détache
      if (cote === "g" && lien[i] != null) delete lien[i];
      if (cote === "d" && gaucheDe(i) != null) delete lien[gaucheDe(i)];
      actif = { cote, i };
    }
    dessiner();
  }
  dessiner();

  $valider.addEventListener("click", () => {
    if (vue.repondu) return;
    const justes = q.paires.filter((_, g) => lien[g] === g).length;
    const ok = justes === n;
    $g.innerHTML = q.paires.map((p, g) => `
      <button class="tuile ${lien[g] === g ? "bonne" : "mauvaise"}" disabled>
        <span class="pastille p${g}">${g + 1}</span><span>${md(p[0])}</span>
      </button>`).join("");
    // À droite, on remet les effets dans l'ordre de la gauche pour montrer la correction
    $d.innerHTML = q.paires.map((p, d) => `
      <button class="tuile ${lien[d] === d ? "bonne" : "mauvaise"}" disabled>
        <span class="pastille p${d}">${d + 1}</span><span>${md(p[1])}</span>
      </button>`).join("");
    $valider.parentElement.remove();
    enregistrer(id, index, ok);
    afficherRetour(q, ok, id, index, ok ? "" : `${justes}/${n} bonnes paires, la correction est affichée`);
  });
  vue.raccourcis = touche => { if (touche === "Enter" && !$valider.disabled) $valider.click(); };
}

/* =====================================================================
   Bilan de niveau
   ===================================================================== */
function afficherBilan(id) {
  vue = { ecran: "bilan", id };
  const niveau = niveauParId(id);
  const s = score(id);
  const total = niveau.questions.length;
  const e = etoiles(s);
  const meilleur = etat.niveaux[id].meilleur;
  const messages = [
    "C’est un début : la correction de chaque question vaut le détour. Rejouer le niveau permet de tout consolider.",
    "Les bases sont là. Encore un passage pour la deuxième étoile ?",
    "Solide. Il ne manque presque rien.",
    "Impeccable. Rien à ajouter.",
  ];
  const iNiveau = NIVEAUX.indexOf(niveau);
  const suivant = NIVEAUX[iNiveau + 1];

  $app.innerHTML = `
    <div style="${couleur(niveau)}">
      <div class="barre-haut">
        <button class="retour" id="retour">← Accueil</button>
        <span class="niveau-tag">${md(niveau.titre)}</span>
      </div>
      <article class="question bilan">
        <div class="type">Bilan du niveau ${iNiveau + 1}</div>
        <div class="grandes-etoiles">${htmlEtoiles(e, "").replace(/^<span[^>]*>|<\/span>$/g, "")}</div>
        <div class="grand-score">${s}<small>/${total}</small></div>
        <p class="message">${messages[e]}</p>
        ${meilleur != null && meilleur > s ? `<p class="meilleur">Meilleur score sur ce niveau : ${meilleur}/${total}</p>` : ""}
        <div class="reflexes">
          <h3>Trois réflexes à retenir</h3>
          <ol>${niveau.reflexes.map(r => `<li>${md(r)}</li>`).join("")}</ol>
        </div>
        <div class="actions-bilan">
          ${suivant ? `<button class="btn" id="suite" style="--c: var(--${suivant.id})">Niveau ${iNiveau + 2} : ${md(suivant.titre)} →</button>` : `<button class="btn" id="suite">Retour à l’accueil</button>`}
          <button class="btn secondaire" id="rejouer">Rejouer ce niveau</button>
        </div>
      </article>
    </div>`;
  document.getElementById("retour").addEventListener("click", afficherAccueil);
  document.getElementById("suite").addEventListener("click", () => suivant ? ouvrirNiveau(suivant.id) : afficherAccueil());
  document.getElementById("rejouer").addEventListener("click", () => {
    etat.niveaux[id].reponses = {};
    sauver();
    afficherQuestion(id, 0);
  });
  window.scrollTo(0, 0);
}

/* =====================================================================
   Clavier
   ===================================================================== */
document.addEventListener("keydown", ev => {
  if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
  if (vue.ecran !== "question") return;
  if (vue.repondu) {
    if (ev.key === "Enter" && document.activeElement && document.activeElement.id !== "suivant") {
      const b = document.getElementById("suivant");
      if (b) { ev.preventDefault(); b.click(); }
    }
    return;
  }
  if (vue.raccourcis && !(ev.key === "Enter" && document.activeElement && document.activeElement.tagName === "BUTTON" && document.activeElement.id !== "valider")) {
    vue.raccourcis(ev.key);
  }
});

afficherAccueil();
</script>
